name: npm registry evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read current public package metadata
        run: npm view openquire name version dist-tags time.1.0.3 dist.integrity dist.tarball --json
      - name: Record source component versions
        run: |
          node -e "for (const path of ['package.json', 'cli/package.json', 'src-tauri/tauri.conf.json']) { const v = require('./' + path); console.log(path + ': ' + v.version) }"
