[package]
name = "openquire"
version = "0.2.2"
description = "OpenQuire, an open source PDF suite"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "openquire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openquire-core = { path = "../crates/openquire-core" }
openquire-crypto = { path = "../crates/openquire-crypto" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
percent-encoding = "2"
cryptoki = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]

