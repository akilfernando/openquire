[workspace]
members = [
    "crates/openquire-crypto",
    "crates/openquire-core",
    "crates/openquire-cli",
]
exclude = [
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["OpenQuire Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
sha2 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = { version = "0.10", features = ["encryption", "pkcs5", "std"] }
x509-parser = "0.16"
walkdir = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }
